<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in your TV · MovieTimelines</title>
<link rel="icon" href="favicon.ico">
<style>
  :root { --bg:#0e0f13; --card:#171920; --fg:#eef0f4; --mut:#9aa0ad; --acc:#e0913c; --bad:#e06060; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px;
         background:var(--bg); color:var(--fg); font:16px/1.5 Inter,system-ui,sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:18px; padding:28px 24px; text-align:center; }
  h1 { font-size:22px; margin:0 0 6px; }
  p { color:var(--mut); margin:0 0 20px; }
  button { width:100%; border:0; border-radius:12px; padding:15px; font:600 17px Inter,system-ui,sans-serif; cursor:pointer;
           background:var(--acc); color:#1a1205; }
  button.alt { background:transparent; color:var(--mut); font-weight:500; font-size:14px; padding:10px; margin-top:8px; }
  button:disabled { opacity:.6; }
  .who { font-weight:600; color:var(--fg); }
  .err { color:var(--bad); margin-top:14px; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Sign in your TV</h1>
  <p id="msg">Checking your MovieTimelines account…</p>
  <button id="go" hidden></button>
  <button id="other" class="alt" hidden>Use a different Google account</button>
  <div id="err" class="err" hidden></div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyB6X6zrognYJ_6AZbWkCBEGu6mX0K1I2iw",
  authDomain: "movietimeline-35751.firebaseapp.com",
  projectId: "movietimeline-35751",
  appId: "1:649737119101:web:fea06da196af8d17f85814",
});
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const $ = (id) => document.getElementById(id);

// QR from the TV: #k=<base64url AES-256 key>&h=<tv lan ip>:<port>. The fragment never reaches a server.
const q = new URLSearchParams(location.hash.slice(1));
const k = q.get('k') || '', h = q.get('h') || '';
const lan = /^(10\.\d{1,3}|192\.168|172\.(1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}:\d{2,5}$/.test(h);

const b64u = {
  dec: (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)), (c) => c.charCodeAt(0)),
  enc: (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
};
const fail = (t) => { $('err').textContent = t; $('err').hidden = false; };

async function send(user) {
  $('go').disabled = true;
  try {
    const key = await crypto.subtle.importKey('raw', b64u.dec(k), 'AES-GCM', false, ['encrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const payload = new TextEncoder().encode(JSON.stringify({
      uid: user.uid, email: user.email || '', name: user.displayName || '', refreshToken: user.refreshToken,
    }));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, payload));
    const blob = new Uint8Array(iv.length + ct.length);
    blob.set(iv); blob.set(ct, iv.length);
    // Top-level navigation to the TV on the LAN (fetch() from https → http LAN would be blocked).
    location.replace(`http://${h}/pair?d=${b64u.enc(blob)}`);
  } catch (e) {
    $('go').disabled = false;
    fail('Couldn’t encrypt for the TV: ' + (e.message || e));
  }
}

async function login() {
  try { await signInWithPopup(auth, provider); }
  catch (e) {
    if (/popup/.test(e.code || '')) await signInWithRedirect(auth, provider);
    else fail(e.message || String(e));
  }
}

if (!lan || b64u.dec(k).length !== 32) {
  $('msg').textContent = 'This link is incomplete. Open “Sign in with phone” on the TV and scan the QR code again.';
} else {
  onAuthStateChanged(auth, (user) => {
    $('go').hidden = false;
    $('go').disabled = false;
    if (user) {
      $('msg').innerHTML = 'Signed in as <span class="who"></span>. Your TV will sync watch progress to this account.';
      $('msg').querySelector('.who').textContent = user.email || user.displayName || 'you';
      $('go').textContent = 'Send to TV';
      $('go').onclick = () => send(user);
      $('other').hidden = false;
      $('other').onclick = async () => { await signOut(auth); login(); };
    } else {
      $('msg').textContent = 'Sign in with the Google account you use on MovieTimelines.';
      $('go').textContent = 'Sign in with Google';
      $('go').onclick = login;
      $('other').hidden = true;
    }
  });
}
</script>
<script src="https://hackatoa.com/cookie-notice.js" data-mode="essential" data-policy="https://hackatoa.com/cookies/" data-privacy="https://hackatoa.com/privacy/" defer></script>
</body>
</html>
