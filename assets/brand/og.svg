  </g>
  <text x="98" y="266" font-family="DejaVu Sans, sans-serif" font-weight="700" font-size="52" fill="#ffffff">Track franchises in timeline order.</text>
  <text x="100" y="330" font-family="DejaVu Sans, sans-serif" font-size="30" fill="#9195a4">Every film &amp; series, episode by episode — with your watch time tallied.</text>
