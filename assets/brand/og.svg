    <circle cx="330" cy="456" r="16" fill="#e62429"/><text x="330" y="512">MCU</text>
    <circle cx="490" cy="456" r="16" fill="#e0a72e"/><text x="490" y="512">Jurassic</text>
    <circle cx="650" cy="456" r="16" fill="#37a6ac"/><text x="650" y="512">Pirates</text>
    <circle cx="800" cy="456" r="16" fill="#c9a55c"/><text x="800" y="512">John Wick</text>
    <circle cx="950" cy="456" r="16" fill="#e0913c"/><text x="950" y="512">Dune</text>
    <circle cx="1070" cy="456" r="16" fill="#ff3b3b"/><text x="1070" y="512">Rangers</text>
