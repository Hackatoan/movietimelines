      <stop offset="0" stop-color="#101015"/>
      <stop offset="1" stop-color="#0ب0b0e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
